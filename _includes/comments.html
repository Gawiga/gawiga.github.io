<section class="comments">
    <h3>{% if page.lang == "en" %}Comments{% else %}Comentários{% endif %}</h3>
    <div id="disqus_thread"></div>
    <button type="button" id="load-comments" class="btn">
        {% if page.lang == "en" %}Load comments{% else %}Carregar comentarios{% endif %}
    </button>
</section>
<script>
    var disqusLoaded = false;
    var disqusButton = document.getElementById('load-comments');

    function loadDisqus() {
        if (disqusLoaded) {
            return;
        }

        disqusLoaded = true;
        disqusButton.disabled = true;
        disqusButton.textContent = '{% if page.lang == "en" %}Comments loaded{% else %}Comentarios carregados{% endif %}';

        window.disqus_config = function () {
            this.page.url = '{{ site.url }}{{ site.baseurl }}{{ page.url }}';
            this.page.identifier = '{{ page.url }}';
        };

        var d = document;
        var s = d.createElement('script');
        s.src = 'https://gawiga-com.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
    }

    if (disqusButton) {
        disqusButton.addEventListener('click', loadDisqus);
    }
</script>
<noscript>{% if page.lang == "en" %}Please enable JavaScript{% else %}Por favor, habilite o javascript{% endif %} <a href="https://disqus.com/?ref_noscript">{% if page.lang == "en" %}to comment and enable Disqus.{% else %}para comentar e habilitar o Disqus.{% endif %}</a></noscript>
